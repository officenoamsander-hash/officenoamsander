<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מערכת גבייה</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1c2433;--mute:#6b7689;--line:#e3e8f0;--pri:#2457d6;--ok:#14864a;--warn:#c27a00;--bad:#c62f2f;--okbg:#e4f5ec;--warnbg:#fff3d9;--badbg:#fde7e7;--pribg:#e7eefc}
@media(prefers-color-scheme:dark){:root{--bg:#10141c;--card:#181e2a;--ink:#e8ecf4;--mute:#93a0b6;--line:#2a3345;--pri:#6b94ff;--ok:#4cc486;--warn:#f0b13e;--bad:#ff7b7b;--okbg:#14301f;--warnbg:#3a2d10;--badbg:#3b1b1b;--pribg:#1b2848}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;margin-inline-end:auto}
main{max-width:1200px;margin:0 auto;padding:16px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--pri)}
.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.sm{padding:3px 8px;font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button.on{background:var(--pribg);border-color:var(--pri);color:var(--pri);font-weight:600}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:24px;margin-top:2px}
.kpi span{color:var(--mute);font-size:13px}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap;cursor:default}
tr:hover td{background:var(--bg)}
.tw{overflow-x:auto}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)}.t-warn{background:var(--warnbg);color:var(--warn)}.t-bad{background:var(--badbg);color:var(--bad)}.t-pri{background:var(--pribg);color:var(--pri)}
.bar{display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--line);margin:8px 0}
.bar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;min-width:0}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:18px;width:min(640px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
.log{border-inline-start:3px solid var(--line);padding:2px 10px;margin:6px 0;font-size:14px}
.mute{color:var(--mute);font-size:13px}
.empty{text-align:center;color:var(--mute);padding:28px}
h2{font-size:16px;margin:0 0 10px}
@media(max-width:640px){.filters{grid-template-columns:1fr}th:nth-child(n+6),td:nth-child(n+6){display:none}}
@media print{header,.tabs,button{display:none!important}}
</style>
</head>
<body>
<header>
  <h1>💰 מערכת גבייה — ד"ר נעם סנדר הנדסה ורישוי</h1>
  <button id="bAdd" class="pri">+ חוב חדש</button>
  <button id="bImp">ייבוא CSV</button>
  <button id="bExp">ייצוא CSV</button>
  <button id="bBak">גיבוי</button>
  <button id="bRes">שחזור</button>
  <input type="file" id="fileIn" hidden>
</header>
<main>
  <div class="tabs" id="tabs">
    <button data-t="todo" class="on">📌 לטיפול היום</button>
    <button data-t="all">כל החובות</button>
    <button data-t="cust">לפי לקוח</button>
    <button data-t="q">❓ שאלות לנעם</button>
    <button data-t="dash">סיכום וגיול חובות</button>
    <button data-t="help">הגדרות והסבר</button>
  </div>
  <div id="view"></div>
</main>

<dialog id="dlg"></dialog>

<script>
"use strict";
/* ---------- אחסון ---------- */
const KEY="collections.v1";
let S={items:[],questions:[],cfg:{biz:'ד"ר נעם סנדר הנדסה ורישוי בע"מ',bank:'',terms:30,gap1:7,gap2:7,gap3:3}};
const SEED=[{"id": "s1", "customer": "מלון מגדלה", "contact": "דניאל", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "הצעת המחיר: 45,000 ₪ + מע\"מ, בתשלומים 30% / 30% / 20% / 20% | תזכורת למחר | תזכורת למחר", "payments": [], "log": []}, {"id": "s2", "customer": "ליקווידיום", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "למצוא הצעת מחיר לגיא גרלניק", "payments": [], "log": []}, {"id": "s3", "customer": "מסעדה חלבית גדרה", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 10000, "status": "", "notes": "לשאול את עוז גדרה מי מטפל ולשלם חצי מקדמה | 10,000 ₪ כולל מע\"מ", "payments": [], "log": []}, {"id": "s4", "customer": "פרישמן 42 - טנדס", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "הצעת המחיר: 25,000 ₪ + מע\"מ, שלושה סעיפים | חצי מקדמה", "payments": [], "log": []}, {"id": "s5", "customer": "מלון סטאי - רישוי", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "", "payments": [], "log": []}, {"id": "s6", "customer": "אבירם לגזיאל", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "נעם צריך לשבת איתו", "payments": [], "log": []}, {"id": "s7", "customer": "איציק הגדול", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "נעם צריך לשבת איתו", "payments": [], "log": []}, {"id": "s8", "customer": "פיצי רמת השרון", "contact": "חיים כהן", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 22000, "status": "", "notes": "לשלם ב 2 צקים אחד עכשיו והשני דחוי", "payments": [], "log": []}, {"id": "s9", "customer": "פיצי עזריאלי", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 22000, "status": "", "notes": "כנ״ל", "payments": [], "log": []}, {"id": "s10", "customer": "יוניקו חולון", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 30000, "status": "", "notes": "נתי יוניקו לשאול מה שם החברה הכל בבת אחת | 30,000 ₪ + מע\"מ", "payments": [], "log": []}, {"id": "s11", "customer": "קורון פטיסרי - קיבוץ עברון", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "", "payments": [], "log": []}, {"id": "s12", "customer": "מעדני נטלי", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "נעם יפגוש אתו לקחת צ׳קים", "payments": [], "log": []}, {"id": "s13", "customer": "קומל ראש העין", "contact": "מתן רוזנברג", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "", "payments": [], "log": []}, {"id": "s14", "customer": "ברוסטר צ'יקן עזריאלי", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "לדבר איתה שתשלם", "payments": [], "log": []}, {"id": "s15", "customer": "קיבוץ דורות", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "להוציא הצעת מחיר", "payments": [], "log": []}, {"id": "s16", "customer": "פיטמאסטר יהוד", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 35000, "status": "", "notes": "", "payments": [], "log": []}, {"id": "s17", "customer": "פיטמאסטר ראשון לציון", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "לא סוכם הסכום", "payments": [], "log": []}, {"id": "s18", "customer": "שניצל ראש העין", "contact": "ירון", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "הצעת המחיר: 14,000 ₪ + מע\"מ - 10,000 בתחילת העבודה, 4,000 עם קבלת הרישיון", "payments": [], "log": []}, {"id": "s19", "customer": "מיכל אנסקי", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 15000, "status": "", "notes": "15,000 לא נשלחה הצעת מחיר", "payments": [], "log": []}, {"id": "s20", "customer": "קפה מצו חולון", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 7000, "status": "", "notes": "לשלוח הודעה נעם מחכה לחומר", "payments": [], "log": []}, {"id": "s21", "customer": "מסעדת מסקל פלורנטין", "contact": "ארליך זיו לביא", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "9000 ? לא ידוע | בהמתנה", "payments": [], "log": []}, {"id": "s22", "customer": "רשות העתיקות", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "שלחו פתיחת ספק להחזיר את הטפסים | שמולקי מרכוס הצעת מחיר", "payments": [], "log": []}, {"id": "s23", "customer": "אפריקה ישראל", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "", "payments": [], "log": []}, {"id": "s24", "customer": "מלון פולי אורבן", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "", "payments": [], "log": []}, {"id": "s25", "customer": "מלון אופרה", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "", "payments": [], "log": []}, {"id": "s26", "customer": "ענק הבשר", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 15000, "status": "", "notes": "", "payments": [], "log": []}, {"id": "s27", "customer": "לחם הכפר - שימוש חורג", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "", "payments": [], "log": []}, {"id": "s28", "customer": "דופלקס", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "", "payments": [], "log": []}, {"id": "s29", "customer": "מיכל אפשטיין - איטס קונדיטוריה", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "", "payments": [], "log": []}, {"id": "s30", "customer": "איטס מזנון שינקין", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "", "payments": [], "log": []}, {"id": "s31", "customer": "מפעל בית שאן", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "hold", "notes": "עדיין לא לגבות", "payments": [], "log": []}, {"id": "s40", "customer": "סבסטיאן הרצליה", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "quote", "notes": "להוציא הצעת מחיר", "payments": [], "log": []}, {"id": "s41", "customer": "אוגיס רעננה", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "quote", "notes": "", "payments": [], "log": []}, {"id": "s42", "customer": "קומל רעננה", "contact": "", "phone": "", "email": "", "invoice": "", "date": "", "due": "", "amount": 0, "status": "", "notes": "אמור לשלם לביולאב – 7,000 ₪; למצוא את החשבונית ולבקש מביולאב", "payments": [], "log": []}];
let fresh=true;
try{const r=localStorage.getItem(KEY);if(r){S=Object.assign(S,JSON.parse(r));fresh=false}}catch(e){}
if(fresh){S.items=SEED;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("לא ניתן לשמור בדפדפן — השתמש בגיבוי")}};
const uid=()=>Math.random().toString(36).slice(2,10);

/* ---------- עזרים ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ils=n=>"₪"+(Math.round(n*100)/100).toLocaleString("he-IL");
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const pd=s=>{if(!s)return null;const d=new Date(s+"T00:00:00");return isNaN(d)?null:d};
const fd=s=>{const d=pd(s);return d?d.toLocaleDateString("he-IL"):"—"};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const days=(a,b)=>Math.round((a-b)/864e5);
const open=i=>i.done?0:Math.max(0,i.amount-(i.payments||[]).reduce((s,p)=>s+p.amount,0));
const isOpen=i=>!i.done&&(i.amount<=0||open(i)>0);
const money=i=>i.amount>0?ils(open(i)):"סכום לא ידוע";
const overdue=i=>{const d=pd(i.due);return d&&open(i)>0?Math.max(0,days(today(),d)):0};
function status(i){
  if(i.status==="legal")return["בטיפול משפטי","t-bad"];
  if(i.status==="hold")return["בהמתנה – לא לפנות","t-pri"];
  if(i.status==="quote")return["להוצאת הצעת מחיר","t-pri"];
  if(!isOpen(i))return["שולם","t-ok"];
  const pp=pd(i.promise);
  if(pp&&pp>=today())return["הבטחת תשלום","t-pri"];
  const o=overdue(i);
  if(o>60)return["באיחור 60+","t-bad"];
  if(o>0)return["באיחור "+o+" ימים","t-warn"];
  return[i.due?"טרם הגיע מועד":"ממתין לפנייה ראשונה","t-pri"];
}
const nextAction=i=>{ // תאריך המעקב הבא
  if(!isOpen(i)||i.status)return null;
  const pp=pd(i.promise);if(pp&&pp>=today())return pp;
  if(i.next)return pd(i.next);
  const d=pd(i.due);return d?addDays(d,1):today();
};
/* ---------- שלבי תשלום, מסלול חשבוניות, מי צריך לפעול ---------- */
const VAT=1.18;
const ST=["עוד לא הגיע מועד","לגבייה","הבטיח","הועבר – לא נקלט","צ'ק – ממתין לאיסוף","צ'ק הופקד","צ'ק חזר","התקבל בבנק"];
const INV=["לא הוצאה","חשבונית עסקה – יצאה","נשלחה ללקוח","חשבונית מס קבלה – יצאה"];
const WAIT={"":"—",noam:"ממתין לנעם",margalit:"ממתין למרגלית",client:"ממתין ללקוח"};
const gross=s=>Math.round((s.incl?+s.amount:+s.amount*VAT)*100)/100;
const curStage=i=>(i.stages||[]).find(s=>s.st!=="התקבל בבנק");
function flags(i){
  if(i.status||i.done&&!(i.stages||[]).length)return[];
  const f=[];
  (i.stages||[]).forEach(s=>{const n=` (${s.label})`;
    if(s.st==="הועבר – לא נקלט")f.push(["לוודא בבנק"+n,"t-warn"]);
    if(s.st==="צ'ק – ממתין לאיסוף")f.push(["לאסוף צ'ק"+n,"t-warn"]);
    if(s.st==="צ'ק הופקד")f.push(["לוודא שהצ'ק נקלט"+n,"t-pri"]);
    if(s.st==="צ'ק חזר")f.push(["צ'ק חזר!"+n,"t-bad"]);
    if(s.st==="התקבל בבנק"&&s.inv!==INV[3])f.push(["להוציא מס קבלה"+n,"t-warn"]);
    if((s.st==="לגבייה"||s.st==="הבטיח")&&s.inv===INV[0])f.push(["להוציא חשבונית עסקה"+n,"t-warn"]);
  });
  return f;
}
const openQ=c=>(S.questions||[]).filter(q=>q.status!=="נענתה"&&(c===undefined||q.customer===c));
const qDays=q=>Math.max(0,days(today(),pd(q.date)||today()));
const customers=()=>[...new Set(S.items.map(i=>i.customer))].sort((a,b)=>a.localeCompare(b,"he"));

/* ---------- ניווט ---------- */
let tab="todo",F={q:"",st:"open",sort:"over"};
$("#tabs").onclick=e=>{const t=e.target.dataset.t;if(!t)return;tab=t;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b===e.target));render()};
function render(){({todo:vTodo,all:vAll,cust:vCust,q:vQ,dash:vDash,help:vHelp})[tab]();}

/* ---------- תצוגות ---------- */
function rowHTML(i){const[s,c]=status(i);const n=nextAction(i);
  return `<tr><td><b>${esc(i.customer)}</b><div class="mute">${esc([i.contact,i.phone].filter(Boolean).join(" · "))}</div></td>
  <td class="mute" style="max-width:260px">${esc(i.notes||"")}</td><td>${fd(i.due)}</td><td><b>${money(i)}</b>${i.amount>0&&open(i)<i.amount?`<div class="mute">מתוך ${ils(i.amount)}</div>`:""}${(i.stages||[]).length?`<div class="mute">${i.stages.map(x=>esc(x.label)+(x.st==="התקבל בבנק"?" ✔":" …")).join(" · ")}</div>`:""}</td>
  <td><span class="tag ${c}">${s}</span>${i.waiting?` <span class="tag t-pri">${WAIT[i.waiting]}</span>`:""}${flags(i).map(x=>`<div><span class="tag ${x[1]}">${esc(x[0])}</span></div>`).join("")}${(()=>{const q=openQ(i.customer);return q.length?`<div><span class="tag ${Math.max(...q.map(qDays))>=3?"t-bad":"t-warn"}">❓ ${q.length} לנעם · ${Math.max(...q.map(qDays))} ימים</span></div>`:""})()}</td><td>${n?fd(iso(n)):"—"}</td>
  <td class="row" style="flex-wrap:nowrap"><button class="sm" onclick="contact('${i.id}')">📞 מעקב</button><button class="sm" onclick="stages('${i.id}')">🧩 שלבים</button><button class="sm" onclick="askQ('${i.id}')">❓</button><button class="sm" onclick="pay('${i.id}')">💵 שולם</button><button class="sm" onclick="edit('${i.id}')">✏️</button></td></tr>`}
const THEAD=`<thead><tr><th>לקוח</th><th>הערות</th><th>פירעון</th><th>יתרה</th><th>סטטוס</th><th>מעקב הבא</th><th></th></tr></thead>`;

function vTodo(){
  const t=today();
  const list=S.items.filter(i=>{if(i.waiting==="noam")return false;const n=nextAction(i);return(n&&n<=t)||flags(i).length}).sort((a,b)=>flags(b).length-flags(a).length||overdue(b)-overdue(a)||open(b)-open(a));
  const sum=list.reduce((s,i)=>s+open(i),0);

function vDash(){

   <div class="card kpi"><span>בטיפול משפטי</span><b>${ils(legal)}</b></div></div>

   <div class="bar">${tot?B.map((b,k)=>sums[k]?`<div style="background:${b[3]};width:${sums[k]/tot*100}%">${Math.round(sums[k]/tot*100)}%</div>`:"").join(""):""}</div>

function stages(id){const i=get(id);SD={id,list:JSON.parse(JSON.stringify(i.stages||[]))};drawStages()}
function drawStages(){
  const i=get(SD.id);
  const sel=(arr,v,k,n)=>`<select onchange="SD.list[${k}].${n}=this.value;drawStages()">${arr.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("")}</select>`;
  show(`<h2>שלבי תשלום — ${esc(i.customer)}</h2>
  <p class="mute">לכל שלב: סכום, סטטוס תשלום ומסלול חשבונית. כשסטטוס השלב "התקבל בבנק" – הסכום נרשם כתשלום והיתרה יורדת. מע"מ ${Math.round((VAT-1)*100)}%.</p>
  ${SD.list.map((s,k)=>`<div class="card" style="margin-bottom:8px"><div class="form">
   <div><label>שלב</label><input value="${esc(s.label)}" list="sl" onchange="SD.list[${k}].label=this.value"></div>
   <div><label>סכום (₪)</label><input type="number" step="0.01" value="${esc(s.amount)}" onchange="SD.list[${k}].amount=+this.value;drawStages()"></div>
   <div><label>כולל מע"מ?</label><select onchange="SD.list[${k}].incl=this.value==='1';drawStages()"><option value="0" ${s.incl?"":"selected"}>לא – להוסיף מע"מ</option><option value="1" ${s.incl?"selected":""}>כן – כבר כולל</option></select></div>
   <div><label>סטטוס תשלום</label>${sel(ST,s.st,k,"st")}</div>
   <div><label>חשבונית</label>${sel(INV,s.inv,k,"inv")}</div>
   <div><label>מס' חשבונית</label><input value="${esc(s.invNo||"")}" onchange="SD.list[${k}].invNo=this.value"></div></div>
   <div class="row" style="margin-top:6px"><span class="mute">לתשלום: <b>${ils(gross(s))}</b></span><button class="sm" style="margin-inline-start:auto" onclick="SD.list.splice(${k},1);drawStages()">הסר שלב</button></div></div>`).join("")||'<div class="empty">אין שלבים. הוסף שלב או בחר תבנית.</div>'}
  <datalist id="sl"><option value="מקדמה"><option value="תשלום שני (ברישיון)"><option value="תשלום שלישי"><option value="יתרה"></datalist>
  <div class="row"><button onclick="addStage()">+ שלב</button><button onclick="tpl(2)">תבנית: מקדמה 50% + יתרה ברישיון</button><button onclick="tpl(3)">תבנית: שליש מקדמה</button></div>
  <p class="mute" style="margin-top:8px">סה"כ לפי השלבים: <b>${ils(SD.list.reduce((a,s)=>a+gross(s),0))}</b></p>
  <div class="row" style="margin-top:10px"><button class="pri" onclick="saveStages()">שמירה</button><button onclick="close()">ביטול</button></div>`);
}
function addStage(){SD.list.push({id:uid(),label:SD.list.length?"תשלום "+(SD.list.length+1):"מקדמה",amount:0,incl:false,st:ST[0],inv:INV[0],invNo:""});drawStages()}
function tpl(n){const t=+prompt("סכום העסקה הכולל (לפני מע\"מ):");if(!(t>0))return;
  const mk=(l,a)=>({id:uid(),label:l,amount:Math.round(a*100)/100,incl:false,st:ST[1],inv:INV[0],invNo:""});
  const r=x=>Math.round(x*100)/100;
  SD.list=n===2?[mk("מקדמה",t/2),Object.assign(mk("תשלום שני (ברישיון)",t-r(t/2)),{st:ST[0]})]:[mk("מקדמה (שליש)",t/3),Object.assign(mk("תשלום שני",t/3),{st:ST[0]}),Object.assign(mk("תשלום שלישי",t-2*r(t/3)),{st:ST[0]})];drawStages()}
function saveStages(){
  const i=get(SD.id);
  i.stages=SD.list;
  i.payments=(i.payments||[]).filter(p=>!p.sid);
  SD.list.filter(s=>s.st==="התקבל בבנק").forEach(s=>i.payments.push({amount:gross(s),date:s.rdate||iso(today()),method:"שלב: "+s.label,sid:s.id}));
  if(SD.list.length){i.amount=Math.round(SD.list.reduce((a,s)=>a+gross(s),0)*100)/100;i.done=open({...i,done:false})<=0}
  save();close();render()}

/* ---------- הודעות ---------- */
function msgFor(i,level){
  const c=S.cfg,o=overdue(i),cs=curStage(i),amt=cs?`${ils(gross(cs))} (${cs.label})`:i.amount>0?ils(open(i)):"(לפי ההסכם)",inv=i.invoice?` מס' ${i.invoice}`:"";
  const pay=c.bank?`\nפרטי תשלום: ${c.bank}`:"";
  if(level===0)return `שלום ${i.contact||i.customer}, תזכורת ידידותית בנוגע לתשלום עבור ${i.customer}${inv}, על סך ${amt}${i.due?(o?", שהיה אמור להיפרע ב-"+fd(i.due):", שיפרע ב-"+fd(i.due)):""}. אם כבר שולם – תודה והתעלמו מהודעה זו.${pay}\n${c.biz}`;
  if(level===1)return `שלום ${i.contact||i.customer}, פנייה חוזרת בנוגע לתשלום עבור ${i.customer}${inv} על סך ${amt}${o?`, שנמצא בפיגור של ${o} ימים`:""}. נשמח לעדכון על מועד התשלום.${pay}\n${c.biz}`;
  return `${i.contact||i.customer} שלום, התשלום עבור ${i.customer}${inv} על סך ${amt} עדיין פתוח${o?` (פיגור ${o} ימים)`:""}. נבקש להסדיר את התשלום עד ${fd(iso(addDays(today(),5)))}, אחרת נאלץ לשקול המשך טיפול.${pay}\n${c.biz}`;
}
const waLink=(ph,txt)=>{let p=String(ph||"").replace(/\D/g,"");if(p.startsWith("0"))p="972"+p.slice(1);return `https://wa.me/${p}?text=${encodeURIComponent(txt)}`};

function contact(id){
  const i=get(id),n=(i.log||[]).filter(l=>l.t==="contact").length,lvl=Math.min(n,2);
  const gap=n===0?S.cfg.gap1:n===1?S.cfg.gap2:S.cfg.gap3;
  show(`<h2>מעקב — ${esc(i.customer)} · ${money(i)}</h2>
   <p class="mute">${esc(status(i)[0])} · פניות עד כה: ${n}${i.phone?" · "+esc(i.phone):""}${i.notes?" · "+esc(i.notes):""}</p>
   <label>נוסח הודעה (${["תזכורת ידידותית","פנייה חוזרת","התראה אחרונה"][lvl]})</label>
   <textarea id="m_txt" rows="5">${esc(msgFor(i,lvl))}</textarea>
   <div class="row" style="margin:8px 0 14px"><button onclick="sendWA('${id}')" ${i.phone?"":"disabled"}>💬 וואטסאפ</button><button onclick="sendMail('${id}')" ${i.email?"":"disabled"}>✉️ מייל</button><button onclick="navigator.clipboard.writeText($('#m_txt').value)">📋 העתק</button></div>
   <h2>רישום הפנייה</h2><div class="form">
   <div><label>סוג</label><select id="k_ch"><option>שיחה</option><option>וואטסאפ</option><option>מייל</option><option>פגישה</option><option>אין מענה</option></select></div>
   <div><label>הבטחת תשלום עד</label><input id="k_pr" type="date" value="${esc(i.promise||"")}"></div>
   <div><label>לחזור אליו בתאריך</label><input id="k_nx" type="date" value="${iso(addDays(today(),gap))}"></div>
   <div><label>ממתין ל</label><select id="k_wt">${Object.entries(WAIT).map(([k,v])=>`<option value="${k}" ${i.waiting===k?"selected":""}>${v}</option>`).join("")}</select></div></div>
   <div style="margin-top:10px"><label>מה נאמר</label><textarea id="k_note" rows="2"></textarea></div>
   <div class="row" style="margin-top:12px"><button class="pri" onclick="saveContact('${id}')">שמירת פנייה</button><button onclick="close()">סגירה</button></div>
   ${(i.log||[]).length?`<h2 style="margin-top:16px">היסטוריה</h2>${i.log.map(l=>`<div class="log"><span class="mute">${fd(l.d)}</span> ${esc(l.txt)}</div>`).join("")}`:""}`);
}
function sendWA(id){const i=get(id);window.open(waLink(i.phone,$("#m_txt").value),"_blank")}
function sendMail(id){const i=get(id);location.href=`mailto:${i.email}?subject=${encodeURIComponent("תזכורת תשלום — חשבונית "+(i.invoice||""))}&body=${encodeURIComponent($("#m_txt").value)}`}
function saveContact(id){
  const i=get(id);
  i.promise=$("#k_pr").value;i.next=$("#k_nx").value;i.waiting=$("#k_wt").value;
  (i.log??=[]).unshift({d:iso(today()),t:"contact",txt:`${$("#k_ch").value}${$("#k_note").value?": "+$("#k_note").value:""}${i.promise?" · הבטיח עד "+fd(i.promise):""}`});
  save();close();render()}
function remind(name){
  const l=S.items.filter(i=>i.customer===name&&isOpen(i));
  const txt=`שלום ${name}, ריכוז חשבוניות פתוחות:\n`+l.map(i=>`• ${i.invoice?"חשבונית "+i.invoice:i.customer} · ${i.due?"פירעון "+fd(i.due)+" · ":""}${money(i)}`).join("\n")+`\nסה"כ לתשלום: ${ils(l.reduce((s,i)=>s+open(i),0))}`+(S.cfg.bank?`\nפרטי תשלום: ${S.cfg.bank}`:"")+`\nתודה, ${S.cfg.biz}`;
  const ph=(l.find(i=>i.phone)||{}).phone,em=(l.find(i=>i.email)||{}).email;
  show(`<h2>תזכורת מרוכזת — ${esc(name)}</h2><textarea id="m_txt" rows="9">${esc(txt)}</textarea>
   <div class="row" style="margin-top:10px"><button ${ph?"":"disabled"} onclick="window.open(waLink('${esc(ph||"")}',$('#m_txt').value),'_blank')">💬 וואטסאפ</button>
   <button ${em?"":"disabled"} onclick="location.href='mailto:${esc(em||"")}?subject='+encodeURIComponent('ריכוז חשבוניות פתוחות')+'&body='+encodeURIComponent($('#m_txt').value)">✉️ מייל</button>
   <button onclick="navigator.clipboard.writeText($('#m_txt').value)">📋 העתק</button><button onclick="close()">סגירה</button></div>`);
}

/* ---------- CSV / גיבוי ---------- */
function parseCSV(t){
  t=t.replace(/^﻿/,"");const first=t.split("\n")[0];const sep=first.includes("\t")?"\t":first.split(";").length>first.split(",").length?";":",";
  const rows=[];let r=[],f="",q=false;
  for(let k=0;k<t.length;k++){const ch=t[k];
    if(q){if(ch==='"'){if(t[k+1]==='"'){f+='"';k++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===sep){r.push(f);f=""}
    else if(ch==="\n"){r.push(f.replace(/\r$/,""));rows.push(r);r=[];f=""}else f+=ch}
  if(f||r.length){r.push(f);rows.push(r)}return rows.filter(r=>r.some(x=>x.trim()))}
const HM={customer:["לקוח","שם לקוח","שם","customer","name"],phone:["טלפון","נייד","phone","mobile"],email:["אימייל","מייל","email"],invoice:["מס' חשבונית","מספר חשבונית","חשבונית","מספר מסמך","מסמך","invoice"],date:["תאריך","תאריך חשבונית","תאריך מסמך","date"],due:["פירעון","תאריך פירעון","תשלום עד","due"],amount:["סכום","סה\"כ","סהכ","לתשלום","amount","total"],paid:["שולם","שולם עד כה","paid"]};
function normDate(s){s=(s||"").trim();if(!s)return"";let m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;return `${y}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:""}
const num=s=>parseFloat(String(s||"").replace(/[₪,\s]/g,""))||0;
function importCSV(text){
  const rows=parseCSV(text);if(rows.length<2)return alert("הקובץ ריק");
  const h=rows[0].map(x=>x.trim());const idx={};
  for(const k in HM)idx[k]=h.findIndex(x=>HM[k].some(a=>x===a||x.includes(a)&&k!=="date"||x===a));
  if(idx.customer<0||idx.amount<0)return alert("לא נמצאו עמודות 'לקוח' ו-'סכום' בשורת הכותרת");
  let n=0,dup=0;
  rows.slice(1).forEach(r=>{
    const v=k=>idx[k]>=0?(r[idx[k]]||"").trim():"";
    const amount=num(v("amount"));if(!v("customer")||amount<=0)return;
    if(v("invoice")&&S.items.some(i=>i.invoice===v("invoice")&&i.customer===v("customer"))){dup++;return}
    const date=normDate(v("date"))||iso(today());
    const it={id:uid(),customer:v("customer"),phone:v("phone"),email:v("email"),invoice:v("invoice"),date,due:normDate(v("due"))||iso(addDays(pd(date),S.cfg.terms)),amount,status:"",notes:"",payments:[],log:[]};
    const paid=num(v("paid"));if(paid>0)it.payments.push({amount:Math.min(paid,amount),date:iso(today()),method:"יבוא"});
    S.items.push(it);n++});
  save();render();alert(`יובאו ${n} חובות${dup?` · דולגו ${dup} כפולים`:""}`);
}
const dl=(name,txt,type)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()};
$("#bAdd").onclick=()=>edit();
let mode="";
$("#bImp").onclick=()=>{mode="csv";$("#fileIn").accept=".csv,.txt,.tsv";$("#fileIn").click()};
$("#bRes").onclick=()=>{mode="json";$("#fileIn").accept=".json";$("#fileIn").click()};
$("#fileIn").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const t=await f.text();
  if(mode==="csv")importCSV(t);else try{const d=JSON.parse(t);if(!d.items)throw 0;if(confirm("לשחזר? הנתונים הנוכחיים יוחלפו"))S=d,save(),render()}catch{alert("קובץ גיבוי לא תקין")}};
$("#bBak").onclick=()=>dl(`גיבוי-גבייה-${iso(today())}.json`,JSON.stringify(S),"application/json");
$("#bExp").onclick=()=>{const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  dl(`גבייה-${iso(today())}.csv`,"﻿"+["לקוח,טלפון,אימייל,חשבונית,תאריך,פירעון,סכום,שולם,יתרה,ימי פיגור"].concat(S.items.map(i=>[i.customer,i.phone,i.email,i.invoice,i.date,i.due,i.amount,i.amount-open(i),open(i),overdue(i)].map(q).join(","))).join("\n"),"text/csv")};

render();
</script>
